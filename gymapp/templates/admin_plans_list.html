{% extends 'left-sidebar.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Plans</h2>
  <a href="{% url 'admin_plan_add' %}" class="btn btn-primary">Add New Plan</a>
</div>
<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">

        <table id="datatable" class="table table-bordered dt-responsive  nowrap w-100">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Duration (Months)</th>
              <th>Fee</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            {% for plan in plans %}
            <tr>
              <td>{{ forloop.counter }}</td>
              <td>{{ plan.name }}</td>
              <td>{{ plan.duration_months }}</td>
              <td>{{ plan.fee }}</td>
              <td>
                <a href="{% url 'admin_plan_edit' plan.id %}" class="btn btn-info btn-sm waves-effect waves-light">Edit</a>
                <form method="post" action="{% url 'admin_plan_delete' plan.id %}" style="display: inline-block;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm waves-effect waves-light" onclick="return confirm('Are you sure to want to delete this plan?')">Delete</button>
              </form>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>

      </div>
    </div>
  </div> <!-- end col -->
</div> <!-- end row -->

{% endblock %}
