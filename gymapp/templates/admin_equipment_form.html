{% extends 'base.html' %}

{% block content %}

<h2 class="mb-3">
  {% if mode == 'add' %} Add Equipment {% else %} Edit Equipment {% endif %}
</h2>

<form method="post" class="row g-3 w-75">
  {% csrf_token %}
  <div class="col-md-4">
    <label class="form-label">Equipment Name</label>
    <input type="text" name="name" class="form-control" value="{{ equipment.name|default:'' }}">
  </div>
  <div class="col-md-2">
    <label class="form-label">Units</label>
    <input type="number" name="units" class="form-control" value="{{ equipment.units|default:'' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Price</label>
    <input type="number" step="0.01" name="price" class="form-control" value="{{ equipment.price|default:'' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Purchase Date</label>
    <input type="date" name="purchase_date" class="form-control" value="{{equipment.purchase_date|date:'Y-m-d'}}">
  </div>
  <div class="col-md-12">
    <button type="submit" class="btn btn-primary">
      {% if mode == 'add' %} Add Equipment {% else %} Update Equipment {% endif %}
    </button>
    <a href="{% url 'admin_equipment_list' %}" class="btn btn-secondary">Cancel</a>
  </div>
</form>

{% endblock %}
