{% extends 'left-sidebar.html' %}

{% block content %}
  <h2 class="mb-3">My Attendance</h2>

  <!-- start -->
<div class="row">
  <div class="col-12">
    <div class="card">
      <div class="card-body">

        <table id="datatable" class="table table-bordered dt-responsive  nowrap w-100">
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Time In</th>
            </tr>
          </thead>

          <tbody>
            {% for attendance in attendances %}
            <tr>
              <td>{{ forloop.counter }}</td>
              <td>{{ attendance.date }}</td>
              <td>{{ attendance.time_in }}</td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="8" class="text-center">No attendance record found</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>

      </div>
    </div>
  </div> <!-- end col -->
</div> <!-- end row -->
  <!-- end -->
