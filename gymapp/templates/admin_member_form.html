{% extends 'base.html' %}

{% block content %}

<h2 class="mb-3">
  {% if mode == 'add' %} Add Member {% else %} Edit Member {% endif %}
</h2>

<form method="post" class="row g-3 w-75">
  {% csrf_token %}
  {% if mode == 'add' %}
  <div class="col-md-6">
    <label class="form-label">Username</label>
    <input type="text" name="username" class="form-control" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Password</label>
    <input type="text" name="password" class="form-control" required>
  </div>
  {% endif %}
  <div class="col-md-6">
    <label class="form-label">Full Name</label>
    <input type="text" name="full_name" class="form-control" value="{{ member.full_name|default:'' }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Mobile</label>
    <input type="text" name="mobile" class="form-control" value="{{member.mobile|default:''}}" maxlength="10">
  </div>
  <div class="col-md-3">
    <label class="form-label">Age</label>
    <input type="number" name="age" class="form-control" value="{{member.age|default:''}}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Gender</label>
    <select name="gender" class="form-select">
      <option value="">Select Gender</option>
      <option value="Male" {% if member.gender == 'Male' %}selected{% endif %}>Male</option>
      <option value="Female" {% if member.gender == 'Female' %}selected{% endif %}>Female</option>
      <option value="Other" {% if member.gender == 'Other' %}selected{% endif %}>Other</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">Join Date</label>
    <input type="date" name="join_date" class="form-control" value="{{ member.join_date|date:'Y-m-d'|default:'' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Address</label>
    <textarea name="address" class="form-control" rows="2">{{ member.address|default:'' }}</textarea>
  </div>
  <div class="col-md-6">
    <label class="form-label">Membership Plan</label>
    <select name="plan_id" class="form-select">
      <option value="">No Plan</option>
      {% for plan in plans %}
        <option value="{{ plan.id }}" {% if member.plan.id == plan.id %}selected{% endif %}>
          {{ plan.name }} ({{ plan.duration_months }} month) - ${{ plan.fee }}
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Trainer</label>
    <select name="trainer_id" class="form-select">
      <option value="">No trainer</option>
      {% for trainer in trainers %}
        <option value="{{ trainer.id }}" {% if member.trainer.id == trainer.id %}selected{% endif %}>
          {{ trainer.name }} - {{ trainer.specialization }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-12">
    <button type="submit" class="btn btn-primary">
      {% if mode == 'add' %} Add Member {% else %} Update Member {% endif %}
    </button>
    <a href="{% url 'admin_member_list' %}" class="btn btn-secondary"> Cancel </a>
  </div>
</form>

{% endblock %}
