{% extends 'base.html' %}

{% block content %}

<h2 class="mb-3">
  Add Workout / Diet Plan
</h2>

<form method="post" class="row g-3 w-75">
  {% csrf_token %}
  <div class="col-md-6">
    <label class="form-label">Member</label>
    <select name="member_id" class="form-select" required>
      <option value="">Select Member</option>
      {% for member in members %}
        <option value="{{ member.id }}">
          {{ member.full_name }} ({{ member.user.username }})
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Title</label>
    <input type="text" name="title" class="form-control" required>
  </div>
  <div class="col-md-12">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" required rows="5" placeholder="Write workout / diet instruction"></textarea>
  </div>
  <div class="col-md-12">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'admin_workout_plans_list' %}" class="btn btn-secondary">Cancel</a>
  </div>
</form>

{% endblock %}
